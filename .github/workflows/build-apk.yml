# Builds the Android app on GitHub's servers every time you push to main,
# then puts SRMSync.apk on the "apk-latest" release page.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write      # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename it
        run: cp app/build/outputs/apk/release/app-release.apk SRMSync.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: SRMSync-apk
          path: SRMSync.apk

      - name: Update the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION_CODE=$(grep -oP "versionCode \K\d+" app/build.gradle)
          VERSION_NAME=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          PAGE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          # The app reads the versionCode line to know an update exists. Keep it.
          NOTES=$(printf 'Srm Sync %s. Download page: %s\n\nversionCode: %s\nversionName: %s\ncommit: %s' \
            "$VERSION_NAME" "$PAGE" "$VERSION_CODE" "$VERSION_NAME" "${GITHUB_SHA::7}")
          if gh release view apk-latest > /dev/null 2>&1; then
            # Replace the file in place, so the download link never disappears.
            gh release upload apk-latest SRMSync.apk --clobber
            gh release edit apk-latest --title "Srm Sync APK (latest)" --notes "$NOTES"
          else
            gh release create apk-latest SRMSync.apk --target "$GITHUB_SHA" --title "Srm Sync APK (latest)" --notes "$NOTES"
          fi

      - name: Publish the download page (gh-pages branch)
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          SIZE=$(( $(stat -c%s SRMSync.apk) / 1024 ))
          rm -rf site && mkdir site
          cp download-page/* site/
          cp SRMSync.apk site/SrmSync.apk
          sed -i "s/__VERSION__/$VERSION/; s/__SIZE__/${SIZE} KB/; s/__DATE__/$(date -u +'%-d %b %Y')/; s/__SHA__/${GITHUB_SHA::7}/" site/index.html
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Download page for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
