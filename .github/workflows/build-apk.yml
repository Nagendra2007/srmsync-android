# Builds the Android app on GitHub's servers every time you push to main,
# then puts SRMSync.apk on the "apk-latest" release page.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write      # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename it
        run: cp app/build/outputs/apk/release/app-release.apk SRMSync.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: SRMSync-apk
          path: SRMSync.apk

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest SRMSync.apk \
            --target "$GITHUB_SHA" \
            --title "Srm Sync APK (latest)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Open this page on your phone and tap SRMSync.apk to download it."
